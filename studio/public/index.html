<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.22.5/dist/reset.css">
<style>
  body { margin: 0; background: #f5f7fa; font-family: "Be Vietnam Pro", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #boot { display: grid; place-items: center; height: 100vh; color: #8c8c8c; font-size: 14px; }
  .shot-top img { object-fit: cover; object-position: top; }
  .row-click { cursor: pointer; }
  .row-due > td { background: #fff1f0 !important; }
  .msg-box textarea { font-size: 14px; line-height: 1.65; }
  /* trang sửa màn hình: tab chiếm hết chiều cao */
  .editor-tabs { display: flex; flex-direction: column; }
  .editor-tabs .ant-tabs-content-holder, .editor-tabs .ant-tabs-content, .editor-tabs .ant-tabs-tabpane-active { height: 100%; min-height: 0; }
  .editor-tabs .ant-tabs-content-holder { flex: 1; }
</style>
<!-- Ant Design (bản UMD, không cần build) -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@5.22.5/dist/antd-with-locales.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@5.5.2/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
</head>
<body>
<div id="root"><div id="boot">Đang tải Lead Studio…</div></div>
<script src="/app.js"></script>
</body>
</html>
