<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: { extend: {
      fontFamily: { sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'] },
      colors: { brand: { 50: '#eef4ff', 100: '#dbe7ff', 400: '#6b9cff', 500: '#3b76f6', 600: '#2a5fe0', 700: '#2149b8' } },
      boxShadow: { soft: '0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06)' },
    } },
  };
</script>
<style>
  body { -webkit-font-smoothing: antialiased; }
  .scroll-thin::-webkit-scrollbar { width: 8px; } .scroll-thin::-webkit-scrollbar-thumb { background: rgba(127,127,127,.25); border-radius: 8px; }
  .fade-in { animation: fade .18s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .drawer { transition: transform .22s ease; }
  textarea:focus, input:focus, select:focus { outline: none; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#0c0f14] dark:text-slate-200 font-sans">
<div class="flex min-h-screen">

  <!-- ============ Sidebar ============ -->
  <aside class="hidden md:flex w-64 shrink-0 flex-col border-r border-slate-200 dark:border-white/5 bg-white dark:bg-[#11151c] sticky top-0 h-screen">
    <div class="px-5 pt-6 pb-5">
      <div class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 grid place-items-center text-white text-lg shadow-soft">✦</div>
        <div>
          <div class="font-semibold leading-tight">Lead Studio</div>
          <div class="text-xs text-slate-500 dark:text-slate-400">Demo & tin nhắn chào khách</div>
        </div>
      </div>
    </div>
    <nav id="nav" class="px-3 space-y-0.5 text-sm"></nav>
    <div class="mt-auto p-4 space-y-3">
      <div id="llmCard" class="rounded-xl border border-slate-200 dark:border-white/5 p-3 text-xs"></div>
      <div class="flex gap-2 text-xs">
        <a href="http://localhost:8090" target="_blank" class="flex-1 text-center rounded-lg border border-slate-200 dark:border-white/10 py-1.5 hover:bg-slate-50 dark:hover:bg-white/5">NocoDB</a>
        <a href="http://localhost:3000" target="_blank" class="flex-1 text-center rounded-lg border border-slate-200 dark:border-white/10 py-1.5 hover:bg-slate-50 dark:hover:bg-white/5">Metabase</a>
      </div>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="flex-1 min-w-0">
    <!-- mobile tabs -->
    <div id="navMobile" class="md:hidden flex gap-1 overflow-x-auto px-4 pt-4 text-sm"></div>

    <div class="max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-8">
      <div class="flex flex-wrap items-start gap-4 justify-between">
        <div>
          <h1 id="pageTitle" class="text-2xl font-semibold tracking-tight"></h1>
          <p id="pageDesc" class="text-sm text-slate-500 dark:text-slate-400 mt-1"></p>
        </div>
        <div class="flex gap-2">
          <button id="sendModeBtn" class="hidden items-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 text-sm font-medium shadow-soft">▶ Bắt đầu gửi</button>
          <button id="genBtn" class="inline-flex items-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-4 py-2.5 text-sm font-medium shadow-soft">✦ <span id="genLabel">Tạo demo</span></button>
        </div>
      </div>

      <!-- KPIs -->
      <div id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-6"></div>

      <!-- progress -->
      <div id="progress" class="hidden mt-4 rounded-xl border border-brand-100 dark:border-brand-500/20 bg-brand-50 dark:bg-brand-500/10 p-4">
        <div class="flex items-center justify-between text-sm">
          <div class="font-medium text-brand-700 dark:text-brand-400 flex items-center gap-2"><span class="inline-block h-2 w-2 rounded-full bg-brand-500 animate-pulse"></span><span id="progressText"></span></div>
          <div id="progressCount" class="text-brand-700 dark:text-brand-400 tabular-nums"></div>
        </div>
        <div class="mt-2 h-1.5 rounded-full bg-brand-100 dark:bg-white/10 overflow-hidden"><div id="progressBar" class="h-full bg-brand-500 transition-all" style="width:0%"></div></div>
      </div>

      <!-- toolbar -->
      <div id="toolbar" class="mt-6 flex flex-wrap items-center gap-2">
        <div class="relative flex-1 min-w-[200px]">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
          <input id="q" type="search" placeholder="Tìm theo tên hoặc SĐT" class="w-full rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 pl-8 pr-3 py-2 text-sm focus:border-brand-500">
        </div>
        <select id="industry" class="rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#151a22] px-3 py-2 text-sm"></select>
        <select id="sort" class="rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#151a22] px-3 py-2 text-sm">
          <option value="new">Sắp xếp: Mới tạo nhất</option>
          <option value="conf">Sắp xếp: Confident cao nhất</option>
          <option value="score">Sắp xếp: Điểm lead cao nhất</option>
        </select>
        <button id="readyChip" class="rounded-xl border border-slate-200 dark:border-white/10 px-3 py-2 text-sm hover:border-emerald-500">Chỉ “Sẵn sàng”</button>
      </div>

      <!-- bulk -->
      <div id="bulk" class="hidden mt-3 sticky top-2 z-20 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 shadow-soft flex flex-wrap items-center gap-3 text-sm fade-in">
        <span><b id="selCount">0</b> lead đã chọn</span>
        <span class="flex-1"></span>
        <button data-bulk="approved" class="rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5">Duyệt</button>
        <button data-bulk="skipped" class="rounded-lg bg-white/10 hover:bg-white/20 dark:bg-slate-900/10 px-3 py-1.5">Bỏ qua</button>
        <button data-bulk="clear" class="rounded-lg px-2 py-1.5 opacity-70 hover:opacity-100">✕</button>
      </div>

      <!-- list -->
      <div id="list" class="mt-4 space-y-3"></div>
    </div>
  </main>
</div>

<!-- ============ Drawer chi tiết ============ -->
<div id="overlay" class="hidden fixed inset-0 z-30 bg-slate-900/40 backdrop-blur-[2px]"></div>
<aside id="drawer" class="drawer fixed top-0 right-0 z-40 h-full w-full max-w-3xl translate-x-full bg-white dark:bg-[#11151c] shadow-2xl flex flex-col"></aside>

<!-- ============ Chế độ gửi ============ -->
<div id="sendModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto">
  <div id="sendBox" class="mx-auto max-w-5xl bg-white dark:bg-[#11151c] rounded-2xl shadow-2xl overflow-hidden fade-in"></div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 text-sm shadow-soft opacity-0 pointer-events-none transition-opacity"></div>

<script>
// ======================= state & helpers =======================
const VIEWS = {
  draft:    { title: 'Chờ duyệt',   desc: 'Xem demo và tin nhắn LLM vừa tạo. Sửa nếu cần, rồi duyệt những lead bạn muốn gửi.', icon: '✎' },
  approved: { title: 'Sẵn sàng gửi', desc: 'Những lead đã duyệt. Bấm “Bắt đầu gửi” để đi qua từng khách: copy SĐT, tin nhắn, ảnh và tự gửi qua Zalo.', icon: '➤' },
  sent:     { title: 'Đã gửi',      desc: 'Lead bạn đã tự gửi tin. Lead tự chuyển sang “Đã liên hệ” trong NocoDB.', icon: '✓' },
  failed:   { title: 'Lỗi',         desc: 'Lần tạo demo bị lỗi. Bấm “Tạo lại” để thử lại.', icon: '!' },
  skipped:  { title: 'Bỏ qua',      desc: 'Lead bạn đã bỏ qua hoặc bản cũ đã được tạo lại.', icon: '–' },
};
const S = { view: 'draft', rows: [], status: null, sel: new Set(), ready: false, eligible: [] };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('vi-VN');
async function api(url, opt = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opt, body: opt.body ? JSON.stringify(opt.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => (t.style.opacity = 0), 2000); }
async function copyText(text, label) { await navigator.clipboard.writeText(text); toast(`Đã copy ${label}`); }
async function copyImage(url, label) {
  const blob = await (await fetch(url, { cache: 'no-store' })).blob();
  await navigator.clipboard.write([new ClipboardItem({ [blob.type || 'image/png']: blob })]);
  toast(`Đã copy ${label}. Dán vào Zalo bằng Ctrl+V`);
}
const thr = () => S.status?.ready_threshold ?? 80;
const tone = (v) => (v >= thr() ? 'emerald' : v >= 60 ? 'amber' : 'rose');
const TONE = {
  emerald: 'text-emerald-700 bg-emerald-50 ring-emerald-600/15 dark:text-emerald-300 dark:bg-emerald-500/10 dark:ring-emerald-400/20',
  amber: 'text-amber-700 bg-amber-50 ring-amber-600/15 dark:text-amber-300 dark:bg-amber-500/10 dark:ring-amber-400/20',
  rose: 'text-rose-700 bg-rose-50 ring-rose-600/15 dark:text-rose-300 dark:bg-rose-500/10 dark:ring-rose-400/20',
  slate: 'text-slate-600 bg-slate-100 ring-slate-500/10 dark:text-slate-300 dark:bg-white/5 dark:ring-white/10',
  brand: 'text-brand-700 bg-brand-50 ring-brand-600/15 dark:text-brand-400 dark:bg-brand-500/10 dark:ring-brand-400/20',
};
const chip = (text, t = 'slate', title = '') => `<span title="${esc(title)}" class="inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${TONE[t]}">${text}</span>`;
function ring(v, size = 52) {
  const r = (size - 6) / 2, c = 2 * Math.PI * r, col = { emerald: '#10b981', amber: '#f59e0b', rose: '#f43f5e' }[tone(v)];
  return `<div class="relative shrink-0" style="width:${size}px;height:${size}px" title="Confident">
    <svg width="${size}" height="${size}" class="-rotate-90"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="currentColor" class="text-slate-200 dark:text-white/10" stroke-width="5"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v / 100)}"/></svg>
    <div class="absolute inset-0 grid place-items-center text-sm font-semibold tabular-nums">${v}</div></div>`;
}
const hasShots = (r) => Array.isArray(r.shots) && r.shots.length > 0 && r.status !== 'generating';
const shotUrl = (r, f) => `/shots/${r.id}/${f}?v=${r.shots_v || Date.parse(r.created_at)}`;
// 2 tab chính: "llm" (LLM tự thiết kế) và "generic" (template có sẵn, dự phòng). Ảnh cũ không có track → coi là generic.
const TRACKS = [{ key: 'llm', label: 'LLM tự thiết kế' }, { key: 'generic', label: 'Template generic' }];
const trackOf = (x) => x.track || 'generic';
const tracksOf = (r) => TRACKS.filter((t) => (r.shots || []).some((x) => trackOf(x) === t.key));
const mainTrack = (r) => (tracksOf(r)[0] || TRACKS[1]).key;
const thumbShot = (r) => { const tk = mainTrack(r); const s = (r.shots || []).filter((x) => trackOf(x) === tk); return s.find((x) => x.kind === 'mobile') || s[0]; };
const pagesOf = (r, tk = mainTrack(r)) => { const m = new Map(); for (const x of r.shots || []) { if (trackOf(x) !== tk) continue; if (!m.has(x.page)) m.set(x.page, { slug: x.page, title: x.title, view: x.view || 'page', shots: [] }); m.get(x.page).shots.push(x); } return [...m.values()]; };
const VIEW_VI = { page: 'Trang', section: 'Section', modal: 'Modal' };
// Ảnh nên gửi qua Zalo (ưu tiên tab LLM): hero trang chủ + mobile trang chủ + ảnh chính của từng màn hình còn lại
const suggestedShots = (r) => {
  const out = [];
  pagesOf(r).forEach((p, i) => {
    if (i === 0) {
      const hero = p.shots.find((x) => x.kind === 'section' && /hero/.test(x.section || ''));
      if (hero) out.push({ ...hero, why: 'Trang chủ' });
      const m = p.shots.find((x) => x.kind === 'mobile'); if (m) out.push({ ...m, why: 'Trang chủ trên điện thoại' });
    } else {
      const main = p.view === 'modal' ? p.shots.find((x) => x.kind === 'full') : (p.shots.find((x) => x.kind === 'section') || p.shots.find((x) => x.kind === 'full'));
      if (main) out.push({ ...main, why: p.title });
    }
  });
  return out.slice(0, 5);
};
const SECTION_VI = { modal: 'Hộp thoại', header: 'Header', navbar: 'Header', hero: 'Hero', trust_bar: 'Cam kết', stats: 'Số liệu', services: 'Dịch vụ', feature_list: 'Điểm nổi bật', about: 'Giới thiệu', team: 'Đội ngũ', gallery: 'Hình ảnh', process: 'Quy trình', pricing: 'Bảng giá', price_list: 'Bảng giá chi tiết', schedule: 'Lịch', testimonials: 'Đánh giá', faq: 'Hỏi đáp', booking_form: 'Form đặt lịch', contact: 'Liên hệ', cta: 'Kêu gọi (CTA)', footer: 'Footer' };
const leadMeta = (r) => [r.industry, r.area, r.website_label, r.review_count ? `${fmt(r.review_count)} review` : '', r.rating ? `${r.rating}★` : ''].filter(Boolean).map(esc).join(' · ');

// ======================= render im lặng =======================
// Chỉ ghi DOM khi HTML thực sự đổi → polling không làm nhấp nháy, không mất hover/focus/cuộn.
function setHTML(el, html) {
  if (el._html === html) return false;
  el._html = html;
  el.innerHTML = html;
  return true;
}

// ======================= sidebar & header =======================
function renderNav() {
  const c = S.status?.counts || {};
  const items = Object.entries(VIEWS).map(([k, v]) => {
    const n = k === 'failed' ? (c.failed || 0) + (c.generating || 0) : c[k] || 0;
    const active = S.view === k;
    return { k, v, n, active };
  });
  setHTML($('#nav'), items.map(({ k, v, n, active }) => `
    <button data-view="${k}" class="w-full flex items-center gap-3 rounded-lg px-3 py-2 ${active ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-400 font-medium' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-white/5'}">
      <span class="w-5 text-center opacity-80">${v.icon}</span><span class="flex-1 text-left">${v.title}</span>
      ${n ? `<span class="text-xs tabular-nums rounded-full px-2 py-0.5 ${active ? 'bg-brand-100 dark:bg-brand-500/20' : 'bg-slate-100 dark:bg-white/5'}">${fmt(n)}</span>` : ''}
    </button>`).join(''));
  setHTML($('#navMobile'), items.map(({ k, v, n, active }) =>
    `<button data-view="${k}" class="whitespace-nowrap rounded-full px-3 py-1.5 ${active ? 'bg-brand-600 text-white' : 'bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10'}">${v.title}${n ? ` · ${n}` : ''}</button>`).join(''));
  const s = S.status;
  setHTML($('#llmCard'), s?.llm_configured
    ? `<div class="flex items-center gap-2 font-medium text-emerald-700 dark:text-emerald-400"><span class="h-2 w-2 rounded-full bg-emerald-500"></span>LLM đã kết nối</div>
       <div class="mt-1 text-slate-500 dark:text-slate-400 truncate">${esc(s.model)}</div>
       <div class="mt-1 text-slate-400">${fmt(s.counts.tokens_in + s.counts.tokens_out)} token đã dùng</div>`
    : `<div class="flex items-center gap-2 font-medium text-rose-600 dark:text-rose-400"><span class="h-2 w-2 rounded-full bg-rose-500"></span>Chưa kết nối LLM</div>
       <div class="mt-1 text-slate-500 dark:text-slate-400">Thêm API key vào <code>.env</code></div>`);
}
function renderHeader() {
  const v = VIEWS[S.view], s = S.status;
  $('#pageTitle').textContent = v.title;
  $('#pageDesc').textContent = v.desc;
  const n = Math.min(s?.per_run || 10, s?.eligible || 0);
  $('#genLabel').textContent = s?.job.busy ? 'Đang tạo…' : n ? `Tạo demo cho ${n} lead` : 'Không còn lead chờ';
  $('#genBtn').disabled = !s?.llm_configured || s?.job.busy || !n;
  $('#genBtn').title = !s?.llm_configured ? 'Cần cấu hình LLM trong .env' : '';
  const canSend = S.view === 'approved' && S.rows.length > 0;
  $('#sendModeBtn').classList.toggle('hidden', !canSend);
  $('#sendModeBtn').classList.toggle('inline-flex', canSend);
  const c = s?.counts || {};
  const kpi = (label, val, sub, t) => `<div class="rounded-2xl bg-white dark:bg-white/[.03] border border-slate-200 dark:border-white/5 p-4 shadow-soft">
    <div class="text-xs font-medium text-slate-500 dark:text-slate-400">${label}</div>
    <div class="mt-1 text-2xl font-semibold tabular-nums ${t || ''}">${fmt(val)}</div><div class="text-xs text-slate-400 mt-0.5">${sub}</div></div>`;
  setHTML($('#kpis'), [
    kpi('Lead chờ tạo demo', s?.eligible, 'đủ điểm, có SĐT'),
    kpi('Chờ duyệt', c.draft, 'bản nháp mới'),
    kpi('Sẵn sàng', c.ready, `confident ≥ ${thr()}%`, 'text-emerald-600 dark:text-emerald-400'),
    kpi('Đã gửi 7 ngày', c.sent_7d, `tổng ${fmt(c.sent)} lead`),
  ].join(''));
  const j = s?.job, p = $('#progress');
  p.classList.toggle('hidden', !j?.busy);
  if (j?.busy) {
    const done = j.done + j.failed;
    $('#progressText').textContent = 'Đang tạo demo và tin nhắn…';
    $('#progressCount').textContent = `${done}/${j.total}${j.failed ? ` · ${j.failed} lỗi` : ''}`;
    $('#progressBar').style.width = `${Math.max(4, (done / j.total) * 100)}%`;
  }
  $('#readyChip').className = `rounded-xl border px-3 py-2 text-sm ${S.ready ? 'border-emerald-500 bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300' : 'border-slate-200 dark:border-white/10 hover:border-emerald-500'}`;
}

// ======================= list =======================
function filtered() {
  const q = $('#q').value.trim().toLowerCase(), ind = $('#industry').value, sort = $('#sort').value;
  const rows = S.rows.filter((r) => (!ind || r.industry === ind) && (!S.ready || r.confidence >= thr())
    && (!q || `${r.name} ${r.phone || ''}`.toLowerCase().includes(q)));
  const key = { conf: (r) => r.confidence ?? -1, score: (r) => r.score ?? 0, new: (r) => Date.parse(r.created_at) }[sort];
  return rows.sort((a, b) => key(b) - key(a));
}
const seenIds = new Set(); // thẻ đã từng hiển thị → không chạy hiệu ứng xuất hiện lần nữa
function renderList() {
  const rows = filtered(), list = $('#list');
  $('#toolbar').classList.toggle('hidden', !S.rows.length);
  if (!rows.length) { list._keyed = false; setHTML(list, emptyState()); updateBulk(); return; }
  // chuyển từ trạng thái trống sang danh sách → dọn sạch 1 lần
  if (!list._keyed) { list.innerHTML = ''; list._html = null; list._keyed = true; }
  const existing = new Map([...list.children].map((el) => [el.dataset.id, el]));
  const tpl = document.createElement('template');
  rows.forEach((r, i) => {
    const key = String(r.id), html = rowCard(r);
    let el = existing.get(key);
    if (!el || el._html !== html) {
      tpl.innerHTML = html.trim();
      const fresh = tpl.content.firstElementChild;
      fresh._html = html;
      if (!seenIds.has(key) && seenIds.size) fresh.classList.add('fade-in'); // chỉ thẻ MỚI mới có hiệu ứng
      if (el) el.replaceWith(fresh); else list.appendChild(fresh);
      el = fresh;
    }
    seenIds.add(key);
    existing.delete(key);
    if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); // giữ đúng thứ tự, không vẽ lại
  });
  existing.forEach((el) => el.remove());
  updateBulk();
}
function rowCard(r) {
  const v = Date.parse(r.created_at), editable = ['draft', 'approved'].includes(r.status), sel = S.sel.has(r.id);
  const thumb = hasShots(r)
    ? `<img src="${shotUrl(r, thumbShot(r).file)}" loading="lazy" class="h-full w-full object-cover object-top">`
    : `<div class="h-full w-full grid place-items-center text-2xl ${r.status === 'generating' ? 'animate-pulse' : ''}">${r.status === 'generating' ? '⏳' : '⚠'}</div>`;

    if (t.dataset.step === 'msg') { await copyText(r.message, 'tin nhắn'); sendDone.msg = true; }
    if (t.dataset.step?.startsWith('img:')) { const f = t.dataset.step.slice(4); await copyImage(shotUrl(r, f), 'ảnh'); sendDone['img:' + f] = true; }
    if (t.matches('[data-send-ok]')) { await api(`/api/outreach/${r.id}`, { method: 'PATCH', body: { status: 'sent' } }); toast('Đã ghi nhận đã gửi'); sendI++; sendDone = {}; }
    if (t.matches('[data-send-drop]')) { await api(`/api/outreach/${r.id}`, { method: 'PATCH', body: { status: 'skipped' } }); sendI++; sendDone = {}; }
    if (t.matches('[data-send-skip]')) { sendI++; sendDone = {}; }
    renderSend();
  } catch (err) { toast(err.message); }
});

// ======================= data =======================
async function loadStatus() {
  S.status = await api('/api/status');
  if (!S.eligible.length && S.status.eligible) S.eligible = await api('/api/eligible?limit=' + Math.min(S.status.per_run, 10)).catch(() => []);
}
async function loadList() {
  const st = S.view === 'failed' ? 'failed,generating' : S.view;
  // Postgres trả bigint/numeric dạng chuỗi → đổi về số để so sánh và sắp xếp đúng
  S.rows = (await api('/api/outreach?status=' + st)).map((r) => ({
    ...r, id: Number(r.id), business_id: Number(r.business_id), rating: r.rating == null ? null : Number(r.rating),
  }));
  const inds = [...new Set(S.rows.map((r) => r.industry))].sort(), sel = $('#industry'), cur = sel.value;
  if (sel._inds !== inds.join('|')) {
    sel._inds = inds.join('|');
    sel.innerHTML = '<option value="">Tất cả ngành</option>' + inds.map((i) => `<option ${i === cur ? 'selected' : ''}>${esc(i)}</option>`).join('');
  }
}
let pollT;
/**
 * Tải lại dữ liệu và cập nhật giao diện. silent = true (polling): không toast lỗi, chỉ vá phần thay đổi.
 * Đang tạo demo → 3 giây/lần; bình thường → 20 giây/lần (để thấy cả lượt chạy theo lịch).
 */
async function refresh({ silent = false } = {}) {
  clearTimeout(pollT);
  try { await loadStatus(); await loadList(); } catch (e) { if (!silent) toast(e.message); }
  renderNav(); renderHeader(); renderList();
  if (drawerId && !S.rows.find((r) => r.id === drawerId)) closeDrawer();
  pollT = setTimeout(() => refresh({ silent: true }), S.status?.job.busy ? 3000 : 20000);
}
// Tab trình duyệt bị ẩn thì thôi polling; quay lại thì cập nhật ngay (im lặng)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(pollT); else refresh({ silent: true });
});

// ======================= events =======================
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]');
  if (v) { S.view = v.dataset.view; S.sel.clear(); closeDrawer(); refresh(); }
});
$('#genBtn').addEventListener('click', async () => {
  try { const r = await api('/api/generate-batch', { method: 'POST', body: {} }); toast(r.started ? `Bắt đầu tạo demo cho ${r.started} lead` : r.message); S.eligible = []; refresh(); }
  catch (e) { toast(e.message); }
});
$('#sendModeBtn').addEventListener('click', openSendMode);
['#q', '#industry', '#sort'].forEach((s) => $(s).addEventListener('input', renderList));
$('#readyChip').addEventListener('click', () => { S.ready = !S.ready; renderHeader(); renderList(); });

$('#list').addEventListener('click', (e) => {
  const card = e.target.closest('[data-id]'); if (!card) return;
  const id = Number(card.dataset.id);
  if (e.target.matches('[data-sel]')) { e.target.checked ? S.sel.add(id) : S.sel.delete(id); renderList(); return; }
  if (e.target.closest('[data-stop]')) return;
  openDrawer(id);
});
$('#bulk').addEventListener('click', async (e) => {
  const st = e.target.dataset.bulk; if (!st) return;
  if (st === 'clear') { S.sel.clear(); renderList(); return; }
  const r = await api('/api/outreach/bulk', { method: 'POST', body: { ids: [...S.sel], status: st } });
  toast(st === 'approved' ? `Đã duyệt ${r.updated} lead, xem ở mục “Sẵn sàng gửi”` : `Đã bỏ qua ${r.updated} lead`);
  S.sel.clear(); refresh();
});

$('#overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); $('#sendModal').classList.add('hidden'); } });
let saveT;
$('#drawer').addEventListener('input', (e) => {
  if (e.target.id !== 'dMsg') return;
  const id = drawerId, val = e.target.value;
  $('#dLen').textContent = val.length; $('#dSaved').textContent = 'Đang lưu…';
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    await api(`/api/outreach/${id}`, { method: 'PATCH', body: { message: val } });
    const row = S.rows.find((r) => r.id === id); if (row) row.message = val;
    $('#dSaved').textContent = 'Đã lưu ✓'; renderList();
  }, 600);
});
$('#drawer').addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const r = S.rows.find((x) => x.id === drawerId);
  try {
    if (t.matches('[data-close]')) return closeDrawer();
    if (t.dataset.trackTab) { $('#dGallery').innerHTML = galleryHtml(r, 0, t.dataset.trackTab); return; }
    if (t.dataset.pageTab != null) { $('#dGallery').innerHTML = galleryHtml(r, Number(t.dataset.pageTab), t.dataset.track); return; }
    if (t.dataset.copyShot) return copyImage(shotUrl(r, t.dataset.copyShot), 'ảnh');
    if (t.matches('[data-copy-phone]')) return copyText(r.phone, 'SĐT');
    if (t.matches('[data-copy-msg]')) return copyText($('#dMsg').value, 'tin nhắn');
    if (t.matches('[data-copy-img]')) { const x = suggestedShots(r)[0]; return x && copyImage(shotUrl(r, x.file), 'ảnh'); }
    if (t.matches('[data-restore]')) { $('#dMsg').value = r.message_original; $('#dMsg').dispatchEvent(new Event('input', { bubbles: true })); return; }
    if (t.matches('[data-regen]')) {
      if (!confirm('Tạo lại demo và tin nhắn cho lead này? Bản hiện tại (kể cả nội dung đã sửa) sẽ bị thay.')) return;
      await api(`/api/leads/${r.business_id}/regenerate`, { method: 'POST', body: {} }); toast('Đang tạo lại…'); closeDrawer(); refresh(); return;
    }
    if (t.dataset.status) {
      await api(`/api/outreach/${r.id}`, { method: 'PATCH', body: { status: t.dataset.status } });
      toast({ approved: 'Đã duyệt. Xem ở mục “Sẵn sàng gửi”', skipped: 'Đã bỏ qua', sent: 'Đã ghi nhận đã gửi' }[t.dataset.status]);
      closeDrawer(); refresh();
    }
  } catch (err) { toast(err.message); }
});

refresh();
</script>
</body>
</html>
